title: Windows Password Spraying (Multiple Accounts, Single Source)
id: 0a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9
status: stable
description: >
  Detects a password-spray pattern: a single source (IP or workstation)
  generating failed logon events (EventID 4625) across many distinct target
  accounts within a short window. Tunes out single-account brute force by
  requiring a high count of DISTINCT targeted accounts.
author: Hemanth Kori
date: 2026-08-03
references:
  - https://attack.mitre.org/techniques/T1110/003/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  # Count distinct TargetUserName per source IP within the detection window
  # Sigma itself does not aggregate; this rule is the per-event selector.
  # Aggregation is performed by the backend (Splunk/Sentinel) using the
  # threshold in condition. See spl/kql companions for the grouped query.
  condition: selection
  # Backend aggregation hint (documentation only; not enforced by Sigma):
  #   group by IpAddress/WorkstationName
  #   count(distinct TargetUserName) >= 10 within 10m
falsepositives:
  - Helpdesk / provisioning tools cycling many accounts
  - NAT / VPN egress collapsing users behind one IP (correlate with VPN logs)
  - Mass password-change event causing a wave of 4625s
level: high
tags:
  - attack.credential_access
  - attack.t1110.003
